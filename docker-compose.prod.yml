# ==============================================================================
# Producción — usa el stage `production` del Dockerfile (next build + next start).
# No monta el código fuente ni instala dependencias en runtime.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requisitos: completar el .env con secretos reales (AUTH_SECRET, claves API, etc.)
# y, antes del build, las NEXT_PUBLIC_* (se inyectan en tiempo de build).
# ==============================================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: domicilios-app:prod
    container_name: domicilios-app-prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - domicilios-net

  postgres:
    image: postgres:16-alpine
    container_name: domicilios-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - domicilios-net

  redis:
    image: redis:7-alpine
    container_name: domicilios-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - domicilios-net

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  domicilios-net:
    driver: bridge
