    - generic [ref=e221]:
      - heading "Preguntas Frecuentes" [level=1] [ref=e224]
      - generic [ref=e225]:
        - generic [ref=e227] [cursor=pointer]: ¿Cómo puedo agregar catálogos adicionales a mi cuenta?
        - generic: "Para agregar catálogos adicionales a tu cuenta, sigue estos pasos: 1. Primero, suscríbete a un plan de pago si aún no lo has hecho. 2. Ve a tu Perfil. 3. Haz clic en 'Manejar Plan'. 4. Haz clic en 'Actualizar Plan'. 5. En la sección de planes, verás un botón más (+) donde puedes seleccionar el número de catálogos adicionales que necesitas. 6. Completa el proceso de actualización. Una vez completada la actualización, podrás crear catálogos adicionales en tu cuenta."
      - generic [ref=e228]:
        - generic [ref=e230] [cursor=pointer]: ¿Cómo puedo pagar otro plan?
        - generic: Puedes cambiar de plan dando clic en 'Comenzar' dentro del recuadro de plan en la parte superior de esta página, recuerda seleccionar si prefieres que tu plan sea mensual o anual. Se te redireccionará a la pasarela de pago donde podrás agregar una tarjeta de crédito o débito. Aceptamos la mayoría de las tarjetas Visa y Mastercard, también puedes usar Apple Pay y Google Pay. Una vez que tu banco acepte el cobro, tu cuenta se actualizará automáticamente y podrás disfrutar de todas las características Pro. Para revisar tus métodos de pago basta con agregar tu tarjeta como método de pago accediendo a tu Perfil, dando clic al ícono de usuario/foto de perfil ubicado en la esquina superior derecha. Ya que cargue la pantalla de Perfil, en la parte inferior dar clic al botón 'Manejar Plan'.
      - generic [ref=e231]:
        - generic [ref=e233] [cursor=pointer]: ¿Puedo recibir pedidos con mi catálogo/menú?
        - generic: Sí, puedes configurar tu carrito de compras para recibir pedidos directamente por correo o WhatsApp de tus clientes. Facilitamos tus pedidos para que te comuniques directamente con tus clientes sin la necesidad de cobrarte comisión.
      - generic [ref=e234]:
        - generic [ref=e236] [cursor=pointer]: ¿Qué sucede con mis páginas si cambio de un plan mayor a uno menor?
        - generic: Tus páginas seguiran estando disponibles mostrando solamente el máximo de elementos que permite tu plan actual. Si tenías más páginas creadas que las que permite tu plan actual, no podrás modificarlas hasta tener un plan que tenga un número de páginas mayor o igual a las páginas que has creado.
      - generic [ref=e237]:
        - generic [ref=e239] [cursor=pointer]: ¿Por qué falla mi método de pago?
        - generic: "Las razones más comunes son: el método de pago no tiene fondos o el banco no ha aceptado el cobro. Dependiendo de tu banco nosotros podemos o no saber la razón exacta por la que un cobro ha fallado. Si tu pago ha fallado en la renovación de tu mensualidad o anualidad, te notificaremos por correo electrónico y haremos un segundo intento el día siguiente. Te recomendamos agregar más de un solo método de pago para evitar perder las características de tu plan actual."
      - generic [ref=e240]:
        - generic [ref=e242] [cursor=pointer]: ¿Funciona para menús/catálogos digitales o páginas web?
        - generic: Ambas. Cada creación dentro de Marea Alcalina funciona como menú digital, catálogo digital, página de links, página de biografía, página de presentación y muchos más usos innovadores.
      - generic [ref=e243]:
        - generic [ref=e245] [cursor=pointer]: ¿Qué pasa con mis cobros al cambiar de Plan?
        - generic: Podrás gozar de los beneficios y cambios al instante, tu fecha de corte será la misma y en la siguiente mensualidad se te cobrará lo que corresponde al tiempo que usaste ese plan, más la renovación del siguiente mes con la diferencia de costos entre los planes. Si cambias de Mensual a Anual, se te generará el cobro en ese momento e iniciará una nueva fecha de corte.
      - generic [ref=e246]:
        - generic [ref=e248] [cursor=pointer]: ¿Cómo puedo cancelar mi plan?
        - generic: Puedes cancelar tu plan en cualquier momento simplemente ingresando a tu cuenta en la esquina superior derecha, luego haz clic en Manejar Plan. Después necesitas hacer clic en Cancelar Plan y seguir las instrucciones. Podrás disfrutar de los beneficios de tu plan actual hasta el final del período actual.
