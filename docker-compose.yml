version: '3.8'

services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domicilios-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/domicilios
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - domicilios-net
    command: npm run dev

  # PostgreSQL 16 con pgvector para embeddings de IA
  postgres:
    image: pgvector/pgvector:pg16-latest
    container_name: domicilios-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: domicilios
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - domicilios-net
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=vector"

  # Redis para caché y sessiones
  redis:
    image: redis:7-alpine
    container_name: domicilios-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - domicilios-net
    command: redis-server --appendonly yes

  # pgAdmin para gestionar PostgreSQL via UI (opcional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: domicilios-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@domicilios.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - domicilios-net
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  domicilios-net:
    driver: bridge
